<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pub kvíz - vyhodnocení</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 20px; background:#f7f7f9; color:#222 }
    h1 { margin-top: 0 }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.07) }
    label { display:block; margin-top:10px }
    input[type="text"], input[type="number"] { padding:6px 8px; font-size:14px; width:260px; }
    button { margin:6px; padding:8px 12px; font-size:14px; cursor:pointer }
    table { width:100%; border-collapse:collapse; margin-top:12px }
    th, td { border:1px solid #e1e1e1; padding:8px; text-align:left }
    th { background:#fafafa }
    .muted { color:#666; font-size:13px }
    .controls { margin-top:10px }
    .inline { display:inline-block; vertical-align:middle; margin-right:8px }
    .center { text-align:center }
    #round-form { margin-top:12px; padding:12px; border:1px dashed #ddd; border-radius:6px; background:#fcfcff }
    .team-row { display:flex; gap:8px; align-items:center; margin-bottom:6px }
    .small { width:80px }
    .danger { background:#ffefef; border:1px solid #f5c2c2 }
    .success { background:#f0fff4; border:1px solid #c7f0d0 }
    .note { font-size:13px; color:#444; margin-top:8px }
    .sticky { position:sticky; top:0; background:#fff; padding-top:6px; padding-bottom:6px }
    .round-cell { position:relative }
    .edit-icon { display:none; position:absolute; right:4px; top:4px; font-size:12px; cursor:pointer; color:#666 }
    .round-cell:hover .edit-icon { display:inline-block }
    .round-header { white-space:nowrap }
    .round-header .edit-round, .round-header .delete-round { margin-left:6px; font-size:12px; cursor:pointer }
    .manual-order-note { font-size:12px; color:#666; margin-left:8px }
    .dragging { opacity:0.5 }

    @media print {
      body { background:#fff; margin:0; }
      .container { box-shadow:none; max-width:none; padding:0; }
      #registration > *:not(#teams-list-area),
      #round-section,
      #final-section button,
      .sticky button,
      .edit-round,
      .delete-round,
      .edit-icon,
      .remove-team,
      .edit-team,
      #reset-data,
      #add-team,
      #open-round,
      #finalize,
      #export-csv,
      #close-final,
      .manual-order-note {
        display:none !important;
      }
      table { page-break-inside:avoid; }
      th, td { font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pub kvíz — vyhodnocování</h1>

    <section id="registration">
      <h2>Registrace týmů</h2>
      <div>
        <label>Název týmu:
          <input id="team-name" type="text" placeholder="Zadejte název týmu" />
        </label>
        <button id="add-team">Přidej tým</button>
        <button id="reset-data" class="danger">Resetovat data</button>
        <div class="note">Týmy můžete přidávat kdykoli. Pokud už jsou zadaná kola, nový tým dostane nulu za předchozí kola.</div>
      </div>

      <div id="teams-list-area">
        <h3>Průběžné pořadí</h3>
        <div class="sticky">
          <button id="open-round">Průběžné výsledky (přidat kolo)</button>
          <button id="finalize" class="success">Vyhodnotit</button>
          <button id="print-results">Tisk / PDF</button>
          <label class="inline" style="font-size:13px; margin-left:8px;">
            <input id="auto-sort" type="checkbox" checked /> Automatické řazení
          </label>
        </div>
        <table id="standings-table">
          <thead>
            <tr><th>Pořadí</th><th>Tým</th><th>Celkem bodů</th><th>Počet kol</th><th>Akce</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="round-section" style="display:none">
      <h2>Zadat výsledky kola</h2>
      <div id="round-form">
        <label>Název kola (volitelné):
          <input id="round-name" type="text" placeholder="Např. Kolo 3 / Bonus" />
        </label>
        <div id="scores-inputs"></div>
        <div style="margin-top:8px">
          <button id="save-round">Uložit kolo</button>
          <button id="cancel-round">Zrušit</button>
        </div>
      </div>
    </section>

    <section id="final-section" style="display:none; margin-top:16px">
      <h2>Finální vyhodnocení</h2>
      <div style="margin-bottom:8px">
        <button id="export-csv">Export CSV</button>
      </div>
      <div id="final-results"></div>
      <div style="margin-top:8px">
        <button id="close-final">Zavřít</button>
      </div>
    </section>
  </div>

  <script>
    // Data model: teams: [{name, scores:[], total}], rounds: [{name}]
    const STORAGE_TEAMS = 'pubkviz_teams_v1';
    const STORAGE_ROUNDS = 'pubkviz_rounds_v1';
    const STORAGE_AUTO_SORT = 'pubkviz_auto_sort_v1';

    let teams = JSON.parse(localStorage.getItem(STORAGE_TEAMS) || '[]');
    let rounds = JSON.parse(localStorage.getItem(STORAGE_ROUNDS) || '[]');
    let autoSort = localStorage.getItem(STORAGE_AUTO_SORT) !== 'false';

    const teamNameInput = document.getElementById('team-name');
    const addTeamBtn = document.getElementById('add-team');
    const resetBtn = document.getElementById('reset-data');
    const standingsBody = document.querySelector('#standings-table tbody');
    const standingsHead = document.querySelector('#standings-table thead');
    const autoSortInput = document.getElementById('auto-sort');

    const openRoundBtn = document.getElementById('open-round');
    const roundSection = document.getElementById('round-section');
    const scoresInputs = document.getElementById('scores-inputs');
    const saveRoundBtn = document.getElementById('save-round');
    const cancelRoundBtn = document.getElementById('cancel-round');
    const roundNameInput = document.getElementById('round-name');

    const finalizeBtn = document.getElementById('finalize');
    const finalSection = document.getElementById('final-section');
    const finalResults = document.getElementById('final-results');
    const closeFinalBtn = document.getElementById('close-final');
    const exportCsvBtn = document.getElementById('export-csv');
    const printBtn = document.getElementById('print-results');

    function saveAll() {
      localStorage.setItem(STORAGE_TEAMS, JSON.stringify(teams));
      localStorage.setItem(STORAGE_ROUNDS, JSON.stringify(rounds));
      localStorage.setItem(STORAGE_AUTO_SORT, String(autoSort));
    }

    function recalcTotals() {
      teams.forEach(t => {
        t.total = (t.scores || []).reduce((a,b)=>a+(Number(b)||0), 0);
      });
    }

    function sortTeams() {
      if (!autoSort) return;
      teams.sort((a,b) => {
        if ((b.total || 0) !== (a.total || 0)) return (b.total || 0) - (a.total || 0);
        return String(a.name).localeCompare(String(b.name), undefined, {sensitivity:'base'});
      });
    }

    function renderStandings() {
      recalcTotals();
      sortTeams();
      saveAll();

      const headerRow = document.createElement('tr');
      headerRow.innerHTML = `<th>Pořadí</th><th>Tým</th>`;
      rounds.forEach((r, i) => {
        headerRow.innerHTML += `<th class="round-header">${escapeHtml(r.name || ('Kolo ' + (i+1)))}<button class="edit-round" data-round="${i}" title="Upravit název kola">✎</button><button class="delete-round danger" data-round="${i}" title="Smazat kolo">✕</button></th>`;
      });
      headerRow.innerHTML += `<th>Celkem bodů</th><th>Akce</th>`;
      standingsHead.innerHTML = '';
      standingsHead.appendChild(headerRow);

      standingsBody.innerHTML = '';
      teams.forEach((t, idx) => {
        const tr = document.createElement('tr');
        tr.dataset.teamIndex = String(idx);
        tr.draggable = !autoSort;
        tr.classList.toggle('manual-order-row', !autoSort);
        let rowHtml = `<td class="center">${idx+1}</td><td>${escapeHtml(t.name)}</td>`;
        rounds.forEach((r, i) => {
          const val = (t.scores && typeof t.scores[i] !== 'undefined') ? t.scores[i] : 0;
          rowHtml += `<td class="center round-cell" data-team="${idx}" data-round="${i}"><span class="score-val">${val}</span><span class="edit-icon" title="Upravit">✎</span></td>`;
        });
        rowHtml += `<td class="center">${t.total || 0}</td>`;
        rowHtml += `<td class="center">
            <button data-i="${idx}" class="remove-team">Odstranit</button>
            <button data-i="${idx}" class="edit-team">Upravit název</button>
          </td>`;
        tr.innerHTML = rowHtml;
        standingsBody.appendChild(tr);
      });

      addRemoveHandlers();
      addRoundCellHandlers();
      addRoundHeaderHandlers();
      attachDragHandlers();
      updateAutoSortLabel();
    }

    function updateAutoSortLabel() {
      autoSortInput.checked = autoSort;
    }

    function addRemoveHandlers() {
      document.querySelectorAll('.remove-team').forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.i);
          if (!confirm('Opravdu odstranit tým "' + teams[i].name + '"?')) return;
          teams.splice(i,1);
          renderStandings();
        };
      });
      document.querySelectorAll('.edit-team').forEach(btn => {
        btn.onclick = () => {
          const i = Number(btn.dataset.i);
          const newName = prompt('Nový název týmu:', teams[i].name);
          if (newName && newName.trim() !== '') {
            teams[i].name = newName.trim();
            renderStandings();
          }
        };
      });
    }

    function addRoundCellHandlers() {
      document.querySelectorAll('.round-cell').forEach(td => {
        td.onclick = (e) => {
          if (e.target.closest('.edit-icon')) {
            const teamIdx = Number(td.dataset.team);
            const roundIdx = Number(td.dataset.round);
            const current = (teams[teamIdx].scores && typeof teams[teamIdx].scores[roundIdx] !== 'undefined') ? teams[teamIdx].scores[roundIdx] : 0;
            const raw = prompt('Upravit skóre pro tým "' + teams[teamIdx].name + '" v kole "' + (rounds[roundIdx].name || ('Kolo ' + (roundIdx+1))) + '":', current);
            if (raw === null) return;
            const val = Number(raw);
            if (!isFinite(val)) { alert('Neplatné číslo.'); return; }
            teams[teamIdx].scores[roundIdx] = val;
            recalcTotals();
            sortTeams();
            saveAll();
            renderStandings();
          }
        };
      });
    }

    function addRoundHeaderHandlers() {
      document.querySelectorAll('.edit-round').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const i = Number(btn.dataset.round);
          const newName = prompt('Upravit název kola:', rounds[i].name || ('Kolo ' + (i+1)));
          if (newName === null) return;
          rounds[i].name = newName.trim() || (rounds[i].name || ('Kolo ' + (i+1)));
          saveAll();
          renderStandings();
        };
      });

      document.querySelectorAll('.delete-round').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const roundIdx = Number(btn.dataset.round);
          const roundLabel = rounds[roundIdx].name || ('Kolo ' + (roundIdx+1));
          if (!confirm('Smazat kolo "' + roundLabel + '"? Tato akce odstraní příslušné skóre z všech týmů.')) return;
          rounds.splice(roundIdx, 1);
          teams.forEach(t => {
            t.scores = t.scores || [];
            t.scores.splice(roundIdx, 1);
          });
          recalcTotals();
          sortTeams();
          saveAll();
          renderStandings();
        };
      });
    }

    function attachDragHandlers() {
      if (autoSort) return;
      const rows = standingsBody.querySelectorAll('tr');
      rows.forEach(row => {
        row.addEventListener('dragstart', (e) => {
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', row.dataset.teamIndex);
        });

        row.addEventListener('dragend', () => {
          row.classList.remove('dragging');
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        row.addEventListener('drop', (e) => {
          e.preventDefault();
          const fromIndex = Number(e.dataTransfer.getData('text/plain'));
          const toIndex = Number(row.dataset.teamIndex);
          if (Number.isNaN(fromIndex) || Number.isNaN(toIndex) || fromIndex === toIndex) return;
          const [moved] = teams.splice(fromIndex, 1);
          teams.splice(toIndex, 0, moved);
          saveAll();
          renderStandings();
        });
      });
    }

    addTeamBtn.addEventListener('click', () => {
      const name = teamNameInput.value.trim();
      if (!name) { alert('Zadejte název týmu.'); return; }
      const newTeam = { name, scores: Array(rounds.length).fill(0), total: 0 };
      teams.push(newTeam);
      teamNameInput.value = '';
      renderStandings();
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm('Smazat všechna data (týmy a kola)?')) return;
      teams = [];
      rounds = [];
      saveAll();
      renderStandings();
      hideRoundSection();
      hideFinalSection();
    });

    openRoundBtn.addEventListener('click', () => {
      if (teams.length === 0) { alert('Nejprve přidejte alespoň jeden tým.'); return; }
      showRoundSection();
    });

    autoSortInput.addEventListener('change', () => {
      autoSort = autoSortInput.checked;
      saveAll();
      renderStandings();
    });

    function showRoundSection() {
      roundSection.style.display = 'block';
      renderRoundInputs();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
    function hideRoundSection() {
      roundSection.style.display = 'none';
      roundNameInput.value = '';
      scoresInputs.innerHTML = '';
    }

    function renderRoundInputs() {
      scoresInputs.innerHTML = '';
      teams.forEach((t, idx) => {
        const div = document.createElement('div');
        div.className = 'team-row';
        div.innerHTML = `
          <div style="width:260px"><strong>${escapeHtml(t.name)}</strong></div>
          <div>
            <input class="small" type="number" min="0" step="1" value="0" data-team="${idx}">
          </div>
        `;
        scoresInputs.appendChild(div);
      });
    }

    saveRoundBtn.addEventListener('click', () => {
      const roundName = roundNameInput.value.trim() || ('Kolo ' + (rounds.length + 1));
      const inputs = scoresInputs.querySelectorAll('input[data-team]');
      const addedScores = [];
      inputs.forEach(inp => {
        const v = Number(inp.value);
        addedScores.push(isFinite(v)? v : 0);
      });
      if (addedScores.length !== teams.length) {
        alert('Chyba: počet vstupů nesouhlasí s počtem týmů.');
        return;
      }
      rounds.push({ name: roundName });
      teams.forEach((t, idx) => {
        t.scores = t.scores || [];
        t.scores.push(Number(addedScores[idx]) || 0);
      });
      recalcTotals();
      sortTeams();
      saveAll();
      hideRoundSection();
      renderStandings();
      alert('Kolo uloženo: ' + roundName);
    });

    cancelRoundBtn.addEventListener('click', () => {
      if (confirm('Zrušit zadávání výsledků kola?')) hideRoundSection();
    });

    finalizeBtn.addEventListener('click', () => {
      if (teams.length === 0) { alert('Žádné týmy.'); return; }
      recalcTotals();
      sortTeams();
      showFinalSection();
    });

    function showFinalSection() {
      finalSection.style.display = 'block';
      buildFinalResults();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
    function hideFinalSection() {
      finalSection.style.display = 'none';
      finalResults.innerHTML = '';
    }

    closeFinalBtn.addEventListener('click', () => hideFinalSection());

    exportCsvBtn.addEventListener('click', () => {
      const csv = buildCsv();
      const bom = '\uFEFF';
      const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kviz-vysledky.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    printBtn.addEventListener('click', () => {
      window.print();
    });

    function buildCsv() {
      const header = ['Pořadí','Tým'];
      rounds.forEach((r, i) => header.push(r.name || ('Kolo ' + (i+1))));
      header.push('Celkem bodů');
      const rows = [header];
      teams.forEach((t, idx) => {
        const row = [];
        row.push(String(idx+1));
        row.push(t.name);
        rounds.forEach((r, i) => {
          const val = (t.scores && typeof t.scores[i] !== 'undefined') ? t.scores[i] : 0;
          row.push(String(val));
        });
        row.push(String(t.total || 0));
        rows.push(row);
      });
      return rows.map(r => r.map(cell => '"' + String(cell).replace(/"/g,'""') + '"').join(',')).join('\n');
    }

    function buildFinalResults() {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const trh = document.createElement('tr');
      trh.innerHTML = `<th>Pořadí</th><th>Tým</th>`;
      rounds.forEach((r, i) => {
        trh.innerHTML += `<th>${escapeHtml(r.name || ('Kolo ' + (i+1)))}</th>`;
      });
      trh.innerHTML += `<th>Celkem bodů</th>`;
      thead.appendChild(trh);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      teams.forEach((t, idx) => {
        const tr = document.createElement('tr');
        let row = `<td class="center">${idx+1}</td><td>${escapeHtml(t.name)}</td>`;
        rounds.forEach((r, i) => {
          const val = (t.scores && typeof t.scores[i] !== 'undefined') ? t.scores[i] : 0;
          row += `<td class="center">${val}</td>`;
        });
        row += `<td class="center">${t.total || 0}</td>`;
        tr.innerHTML = row;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);

      finalResults.innerHTML = '';
      finalResults.appendChild(table);
    }

    function escapeHtml(text) {
      text = (text === undefined || text === null) ? '' : String(text);
      return text
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'", '&#039;');
    }

    renderStandings();

    (function normalizeAfterLoad() {
      let changed = false;
      teams.forEach(t => {
        if (!t.scores) { t.scores = []; changed = true; }
        if (t.scores.length < rounds.length) {
          t.scores = t.scores.concat(Array(rounds.length - t.scores.length).fill(0));
          changed = true;
        }
      });
      if (changed) saveAll();
    })();

    teamNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTeamBtn.click();
    });
  </script>
</body>
</html>
