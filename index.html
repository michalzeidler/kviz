<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pub kvíz - vyhodnocení</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f8fa;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#0f1724;
      --primary:#2563eb;
      --accent:#06b6d4;
      --danger:#ef4444;
      --success:#16a34a;
      --radius:10px;
      --shadow: 0 6px 18px rgba(15,23,36,0.06);
    }
    *{box-sizing:border-box}
    body { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 20px; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased }
    h1 { margin-top: 0; font-weight:600 }
    .container { max-width:1100px; margin: 0 auto; background: var(--card); padding:18px; border-radius:var(--radius); box-shadow:var(--shadow) }
    label { display:block; margin-top:10px; color:var(--muted) }
    input[type="text"], input[type="number"] { padding:8px 10px; font-size:14px; width:100%; border:1px solid #e6edf3; border-radius:8px; background:#fff }
    .row { display:flex; gap:12px; align-items:center }
    .row .col { flex:1 }
    .controls { margin-top:10px; display:flex; gap:8px; align-items:center }
    .btn { display:inline-flex; gap:8px; align-items:center; padding:8px 12px; border-radius:8px; border:0; cursor:pointer; background:#eef2ff; color:var(--primary); font-weight:600 }
    .btn.primary { background:linear-gradient(90deg,var(--primary),#4f46e5); color:#fff }
    .btn.ghost { background:transparent; color:var(--muted); border:1px solid #e6edf3 }
    .btn.danger { background:linear-gradient(90deg,var(--danger),#fb7185); color:#fff }
    .btn.small{ padding:6px 8px; font-size:13px }
    .note { font-size:13px; color:var(--muted); margin-top:8px }

    table { width:100%; border-collapse:collapse; margin-top:12px; border-radius:8px; overflow:hidden }
    thead th { text-align:left; padding:12px 10px; background:linear-gradient(180deg,#fbfdff,#f3f6fb); font-weight:600; border-bottom:1px solid #e6edf3 }
    tbody td { padding:10px; border-bottom:1px solid #f1f5f9; vertical-align:middle }
    tbody tr:nth-child(odd) { background: #fff }
    tbody tr:nth-child(even) { background:#fbfcfe }
    tbody tr:hover { background: #f3f7ff }
    .center{ text-align:center }

    .sticky { position:sticky; top:0; background:var(--card); padding:10px 0; display:flex; gap:8px; align-items:center }

    /* round cell edit icon */
    .round-cell{ position:relative }
    .round-cell .edit-icon{ display:none; position:absolute; right:6px; top:6px; font-size:12px; color:var(--muted); cursor:pointer }
    .round-cell:hover .edit-icon{ display:inline-block }

    /* modal */
    .modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(2,6,23,0.5); align-items:center; justify-content:center; z-index:50 }
    .modal{ width:420px; max-width:92%; background:var(--card); padding:16px; border-radius:12px; box-shadow:0 12px 40px rgba(2,6,23,.4) }
    .modal h3{ margin:0 0 8px 0 }
    .modal .actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px }

    /* drag handle */
    .drag-handle{ cursor:grab; opacity:0.6; margin-right:8px }
    .dragging{ opacity:0.5 }

    /* print styles (tweak) */
    @media print{
      body{background:#fff}
      .container{ box-shadow:none; padding:0; }
      .sticky, .controls, .btn, .note, input, .edit-icon, .edit-round, .delete-round, .remove-team, .edit-team{ display:none !important }
      thead th{ background:#f8fafc }
    }

    /* small screens */
    @media (max-width:700px){
      .row{ flex-direction:column }
      thead th{ font-size:13px }
      tbody td{ font-size:13px }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pub kvíz — vyhodnocování</h1>

    <section id="registration">
      <h2 style="font-size:18px; margin-bottom:8px">Registrace týmů</h2>
      <div class="row">
        <div class="col">
          <label>Název týmu:</label>
          <input id="team-name" type="text" placeholder="Zadejte název týmu" />
        </div>
        <div style="width:260px; display:flex; gap:8px; align-items:center">
          <button id="add-team" class="btn primary">➕ Přidej tým</button>
          <button id="reset-data" class="btn danger">🗑 Resetovat</button>
        </div>
      </div>
      <div class="note">Týmy můžete přidávat kdykoli. Pokud už jsou zadaná kola, nový tým dostane nulu za předchozí kola.</div>

      <div id="teams-list-area" style="margin-top:14px">
        <h3 style="margin:8px 0">Průběžné pořadí</h3>
        <div class="sticky">
          <button id="open-round" class="btn ghost">➕ Přidat kolo</button>
          <button id="finalize" class="btn primary">✅ Vyhodnotit</button>
          <button id="print-results" class="btn ghost">🖨 Tisk / PDF</button>
          <label style="margin-left:8px; font-size:13px; color:var(--muted)"><input id="auto-sort" type="checkbox" checked /> Automatické řazení</label>
        </div>

        <table id="standings-table">
          <thead>
            <tr><th style="width:50px">Pořadí</th><th>Tým</th><th style="width:120px">Celkem bodů</th><th style="width:120px">Počet kol</th><th style="width:160px">Akce</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="round-section" style="display:none; margin-top:12px">
      <h2 style="font-size:18px; margin-bottom:8px">Zadat výsledky kola</h2>
      <div id="round-form" style="background:#fbfdff; padding:12px; border-radius:10px; border:1px solid #eef2ff">
        <div style="display:flex; gap:12px; align-items:center; margin-bottom:10px">
          <div style="flex:1">
            <label>Název kola (volitelné)</label>
            <input id="round-name" type="text" placeholder="Např. Kolo 3 / Bonus" />
          </div>
          <div style="width:220px; display:flex; gap:8px; align-items:center;">
            <button id="save-round" class="btn primary">Uložit kolo</button>
            <button id="cancel-round" class="btn ghost">Zrušit</button>
          </div>
        </div>
        <div id="scores-inputs" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px"></div>
      </div>
    </section>

    <section id="final-section" style="display:none; margin-top:16px">
      <h2 style="font-size:18px; margin-bottom:8px">Finální vyhodnocení</h2>
      <div style="margin-bottom:8px">
        <button id="export-csv" class="btn ghost">📥 Export CSV</button>
      </div>
      <div id="final-results"></div>
      <div style="margin-top:8px">
        <button id="close-final" class="btn ghost">Zavřít</button>
      </div>
    </section>
  </div>

  <!-- Modal backdrop (reused for text/number editing) -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-hidden="true">
    <div class="modal" role="document" aria-modal="true">
      <h3 id="modal-title">Upravit</h3>
      <div id="modal-body">
        <input id="modal-input" type="text" />
      </div>
      <div class="actions" style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px">
        <button id="modal-cancel" class="btn ghost small">Zrušit</button>
        <button id="modal-save" class="btn primary small">Uložit</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_TEAMS = 'pubkviz_teams_v1';
    const STORAGE_ROUNDS = 'pubkviz_rounds_v1';
    const STORAGE_AUTO_SORT = 'pubkviz_auto_sort_v1';

    let teams = JSON.parse(localStorage.getItem(STORAGE_TEAMS) || '[]');
    let rounds = JSON.parse(localStorage.getItem(STORAGE_ROUNDS) || '[]');
    let autoSort = localStorage.getItem(STORAGE_AUTO_SORT) !== 'false';

    // UI elements
    const teamNameInput = document.getElementById('team-name');
    const addTeamBtn = document.getElementById('add-team');
    const resetBtn = document.getElementById('reset-data');
    const standingsBody = document.querySelector('#standings-table tbody');
    const standingsHead = document.querySelector('#standings-table thead');
    const autoSortInput = document.getElementById('auto-sort');

    const openRoundBtn = document.getElementById('open-round');
    const roundSection = document.getElementById('round-section');
    const scoresInputs = document.getElementById('scores-inputs');
    const saveRoundBtn = document.getElementById('save-round');
    const cancelRoundBtn = document.getElementById('cancel-round');
    const roundNameInput = document.getElementById('round-name');

    const finalizeBtn = document.getElementById('finalize');
    const finalSection = document.getElementById('final-section');
    const finalResults = document.getElementById('final-results');
    const closeFinalBtn = document.getElementById('close-final');
    const exportCsvBtn = document.getElementById('export-csv');
    const printBtn = document.getElementById('print-results');

    // modal
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalTitle = document.getElementById('modal-title');
    const modalInput = document.getElementById('modal-input');
    const modalSave = document.getElementById('modal-save');
    const modalCancel = document.getElementById('modal-cancel');
    let modalSaveHandler = null;

    function saveAll(){
      localStorage.setItem(STORAGE_TEAMS, JSON.stringify(teams));
      localStorage.setItem(STORAGE_ROUNDS, JSON.stringify(rounds));
      localStorage.setItem(STORAGE_AUTO_SORT, String(autoSort));
    }

    function recalcTotals(){
      teams.forEach(t => { t.total = (t.scores || []).reduce((a,b)=>a+(Number(b)||0),0); });
    }

    function sortTeams(){
      if (!autoSort) return;
      teams.sort((a,b)=>{ if ((b.total||0)!=(a.total||0)) return (b.total||0)-(a.total||0); return String(a.name).localeCompare(String(b.name), undefined, {sensitivity:'base'}); });
    }

    function renderStandings(){
      recalcTotals();
      sortTeams();
      saveAll();

      // header
      const headerRow = document.createElement('tr');
      headerRow.innerHTML = `<th style="width:50px">Pořadí</th><th>Tým</th>`;
      rounds.forEach((r,i)=>{ headerRow.innerHTML += `<th class="round-header">${escapeHtml(r.name || ('Kolo '+(i+1)))}<button class="edit-round" data-round="${i}" title="Upravit název kola">✎</button><button class="delete-round" data-round="${i}" title="Smazat kolo">✕</button></th>` });
      headerRow.innerHTML += `<th style="width:120px">Celkem bodů</th><th style="width:160px">Akce</th>`;
      standingsHead.innerHTML = '';
      standingsHead.appendChild(headerRow);

      // body
      standingsBody.innerHTML = '';
      teams.forEach((t,idx)=>{
        const tr = document.createElement('tr');
        tr.dataset.teamIndex = String(idx);
        tr.draggable = !autoSort;
        let row = `<td class="center">${idx+1}</td><td style="display:flex; align-items:center"><span class="drag-handle" style="margin-right:8px">☰</span>${escapeHtml(t.name)}</td>`;
        rounds.forEach((r,i)=>{
          const val = (t.scores && typeof t.scores[i] !== 'undefined') ? t.scores[i] : 0;
          row += `<td class="center round-cell" data-team="${idx}" data-round="${i}"><span class="score-val">${val}</span><span class="edit-icon" title="Upravit">✎</span></td>`;
        });
        row += `<td class="center">${t.total||0}</td>`;
        row += `<td class="center"><button data-i="${idx}" class="btn small ghost remove-team">🗑 Odstranit</button> <button data-i="${idx}" class="btn small ghost edit-team">✎ Upravit</button></td>`;
        tr.innerHTML = row;
        standingsBody.appendChild(tr);
      });

      addRemoveHandlers(); addRoundCellHandlers(); addRoundHeaderHandlers(); attachDragHandlers(); updateAutoSortLabel();
    }

    function updateAutoSortLabel(){ autoSortInput.checked = autoSort; }

    function addRemoveHandlers(){
      document.querySelectorAll('.remove-team').forEach(btn=>{ btn.onclick = ()=>{ const i=Number(btn.dataset.i); if(!confirm('Opravdu odstranit tým "'+teams[i].name+'"?')) return; teams.splice(i,1); renderStandings(); } });
      document.querySelectorAll('.edit-team').forEach(btn=>{ btn.onclick = ()=>{ const i=Number(btn.dataset.i); openModal('Upravit název týmu', teams[i].name, 'text', (val)=>{ if(val && val.trim()!==''){ teams[i].name = val.trim(); renderStandings(); } }); } });
    }

    function addRoundCellHandlers(){
      document.querySelectorAll('.round-cell').forEach(td => {
        td.onclick = (e)=>{
          const teamIdx = Number(td.dataset.team);
          const roundIdx = Number(td.dataset.round);
          openModal('Upravit skóre', (teams[teamIdx].scores && typeof teams[teamIdx].scores[roundIdx] !== 'undefined')? String(teams[teamIdx].scores[roundIdx]) : '0', 'number', (val)=>{
            const num = Number(val);
            if(!isFinite(num)){ alert('Neplatné číslo'); return; }
            teams[teamIdx].scores = teams[teamIdx].scores || [];
            teams[teamIdx].scores[roundIdx] = num;
            recalcTotals(); sortTeams(); saveAll(); renderStandings();
          });
        };
      });
    }

    function addRoundHeaderHandlers(){
      document.querySelectorAll('.edit-round').forEach(btn=>{ btn.onclick = (e)=>{ e.stopPropagation(); const i = Number(btn.dataset.round); openModal('Upravit název kola', rounds[i].name || ('Kolo '+(i+1)), 'text', (val)=>{ rounds[i].name = val.trim() || rounds[i].name; saveAll(); renderStandings(); }); }; });
      document.querySelectorAll('.delete-round').forEach(btn=>{ btn.onclick = (e)=>{ e.stopPropagation(); const idx = Number(btn.dataset.round); const label = rounds[idx].name || ('Kolo '+(idx+1)); if(!confirm('Smazat kolo "'+label+'"? Tato akce odstraní skóre z každého týmu.')) return; rounds.splice(idx,1); teams.forEach(t=>{ t.scores = t.scores || []; t.scores.splice(idx,1); }); recalcTotals(); sortTeams(); saveAll(); renderStandings(); }; });
    }

    function attachDragHandlers(){
      const rows = standingsBody.querySelectorAll('tr');
      rows.forEach(row => {
        row.removeEventListener('dragstart', onDragStart);
        row.removeEventListener('dragend', onDragEnd);
        row.removeEventListener('dragover', onDragOver);
        row.removeEventListener('drop', onDrop);

        if(!autoSort){
          row.addEventListener('dragstart', onDragStart);
          row.addEventListener('dragend', onDragEnd);
          row.addEventListener('dragover', onDragOver);
          row.addEventListener('drop', onDrop);
        }
      });
    }
    function onDragStart(e){ this.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', this.dataset.teamIndex); }
    function onDragEnd(){ this.classList.remove('dragging'); }
    function onDragOver(e){ e.preventDefault(); e.dataTransfer.dropEffect='move'; }
    function onDrop(e){ e.preventDefault(); const from = Number(e.dataTransfer.getData('text/plain')); const to = Number(this.dataset.teamIndex); if(Number.isNaN(from)||Number.isNaN(to)||from===to) return; const [moved] = teams.splice(from,1); teams.splice(to,0,moved); saveAll(); renderStandings(); }

    addTeamBtn.addEventListener('click', ()=>{ const name = teamNameInput.value.trim(); if(!name){ alert('Zadejte název týmu.'); return; } teams.push({ name, scores: Array(rounds.length).fill(0), total:0 }); teamNameInput.value=''; renderStandings(); });

    resetBtn.addEventListener('click', ()=>{ if(!confirm('Smazat všechna data (týmy a kola)?')) return; teams=[]; rounds=[]; saveAll(); renderStandings(); hideRoundSection(); hideFinalSection(); });

    openRoundBtn.addEventListener('click', ()=>{ if(teams.length===0){ alert('Nejprve přidejte alespoň jeden tým.'); return; } showRoundSection(); });

    autoSortInput.addEventListener('change', ()=>{ autoSort = autoSortInput.checked; saveAll(); renderStandings(); });

    function showRoundSection(){ roundSection.style.display='block'; renderRoundInputs(); window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }); }
    function hideRoundSection(){ roundSection.style.display='none'; roundNameInput.value=''; scoresInputs.innerHTML=''; }

    function renderRoundInputs(){ scoresInputs.innerHTML=''; teams.forEach((t,idx)=>{ const wrapper = document.createElement('div'); wrapper.className='team-row'; wrapper.innerHTML = `<div style="font-weight:600; margin-bottom:6px">${escapeHtml(t.name)}</div><div><input class="small" type="number" min="0" step="1" value="0" data-team="${idx}"/></div>`; scoresInputs.appendChild(wrapper); }); }

    saveRoundBtn.addEventListener('click', ()=>{
      const roundName = roundNameInput.value.trim() || ('Kolo '+(rounds.length+1));
      const inputs = scoresInputs.querySelectorAll('input[data-team]');
      const addedScores = [];
      inputs.forEach(inp=>{ const v=Number(inp.value); addedScores.push(isFinite(v)?v:0); });
      if(addedScores.length!==teams.length){ alert('Chyba: počet vstupů nesouhlasí s počtem týmů.'); return; }
      rounds.push({ name: roundName });
      teams.forEach((t,idx)=>{ t.scores = t.scores || []; t.scores.push(Number(addedScores[idx])||0); });
      recalcTotals(); sortTeams(); saveAll(); hideRoundSection(); renderStandings();
      flashNote('Kolo uloženo: '+roundName);
    });

    cancelRoundBtn.addEventListener('click', ()=>{ if(confirm('Zrušit zadávání výsledků kola?')) hideRoundSection(); });

    finalizeBtn.addEventListener('click', ()=>{ if(teams.length===0){ alert('Žádné týmy.'); return; } recalcTotals(); sortTeams(); showFinalSection(); });

    function showFinalSection(){ finalSection.style.display='block'; buildFinalResults(); window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }); }
    function hideFinalSection(){ finalSection.style.display='none'; finalResults.innerHTML=''; }
    closeFinalBtn.addEventListener('click', ()=>hideFinalSection());

    exportCsvBtn.addEventListener('click', ()=>{ const csv = buildCsv(); const bom='\uFEFF'; const blob = new Blob([bom+csv], { type:'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='kviz-vysledky.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); });
    printBtn.addEventListener('click', ()=>{ window.print(); });

    function buildCsv(){ const header=['Pořadí','Tým']; rounds.forEach((r,i)=>header.push(r.name||('Kolo '+(i+1)))); header.push('Celkem bodů'); const rows=[header]; teams.forEach((t,idx)=>{ const row=[]; row.push(String(idx+1)); row.push(t.name); rounds.forEach((r,i)=>{ const val=(t.scores&&typeof t.scores[i]!=='undefined')?t.scores[i]:0; row.push(String(val)); }); row.push(String(t.total||0)); rows.push(row); }); return rows.map(r=>r.map(cell=>'"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\n'); }

    function buildFinalResults(){ const table=document.createElement('table'); const thead=document.createElement('thead'); const trh=document.createElement('tr'); trh.innerHTML=`<th>Pořadí</th><th>Tým</th>`; rounds.forEach((r,i)=>{ trh.innerHTML+=`<th>${escapeHtml(r.name||('Kolo '+(i+1)))}</th>`}); trh.innerHTML+=`<th>Celkem bodů</th>`; thead.appendChild(trh); table.appendChild(thead); const tbody=document.createElement('tbody'); teams.forEach((t,idx)=>{ const tr=document.createElement('tr'); let row=`<td class="center">${idx+1}</td><td>${escapeHtml(t.name)}</td>`; rounds.forEach((r,i)=>{ const val=(t.scores&&typeof t.scores[i]!=='undefined')?t.scores[i]:0; row+=`<td class="center">${val}</td>` }); row+=`<td class="center">${t.total||0}</td>`; tr.innerHTML=row; tbody.appendChild(tr); }); table.appendChild(tbody); finalResults.innerHTML=''; finalResults.appendChild(table); }

    // modal helpers
    function openModal(title, value='', type='text', onSave){ modalTitle.textContent = title; modalInput.value = value===undefined? '': String(value); modalInput.type = (type==='number')? 'number':'text'; modalBackdrop.style.display='flex'; modalBackdrop.setAttribute('aria-hidden','false'); modalInput.focus(); modalSaveHandler = ()=>{ onSave(modalInput.value); closeModal(); }; }
    function closeModal(){ modalBackdrop.style.display='none'; modalBackdrop.setAttribute('aria-hidden','true'); modalSaveHandler = null; }
    modalSave.addEventListener('click', ()=>{ if(modalSaveHandler) modalSaveHandler(); });
    modalCancel.addEventListener('click', ()=>{ closeModal(); });
    modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) closeModal(); });
    modalInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ if(modalSaveHandler) modalSaveHandler(); } if(e.key==='Escape'){ closeModal(); } });

    // small toast-like note
    function flashNote(txt){ const el = document.createElement('div'); el.textContent = txt; el.style.position='fixed'; el.style.right='20px'; el.style.bottom='20px'; el.style.background='linear-gradient(90deg,var(--primary),#4f46e5)'; el.style.color='#fff'; el.style.padding='8px 12px'; el.style.borderRadius='8px'; el.style.boxShadow='0 8px 30px rgba(79,70,229,0.12)'; document.body.appendChild(el); setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),400) },1600); }

    function escapeHtml(text){ text=(text===undefined||text===null)?'':String(text); return text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;"); }

    // normalization & init
    (function normalizeAfterLoad(){ let changed=false; teams.forEach(t=>{ if(!t.scores){ t.scores=[]; changed=true } if(t.scores.length<rounds.length){ t.scores = t.scores.concat(Array(rounds.length - t.scores.length).fill(0)); changed=true } }); if(changed) saveAll(); })();

    // init render
    renderStandings();

    // keyboard support for adding
    teamNameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addTeamBtn.click(); });
  </script>
</body>
</html>
